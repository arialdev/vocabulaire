appId: dev.arial.vocabulaire
---
- clearState
- launchApp
- swipe:
    start: 50%, 80%
    end: 50%, 25%
    duration: 500
- swipe:
    start: 50%, 80%
    end: 50%, 25%
    duration: 500
- tapOn: Get started
- tapOn: Create a collection
- tapOn: Collection name
- inputText: Japanese
- hideKeyboard
- tapOn: Save
- tapOn: Open Japanese
- tapOn: Add term
- tapOn:
    id: term-original
- inputText: neko
- runFlow:
    when:
      visible: Keyboard font size updated
    commands:
      - tapOn: OK
- scrollUntilVisible:
    element:
      id: term-translation
    direction: DOWN
- tapOn:
    id: term-translation
- assertVisible:
    id: term-translation
    focused: true
- inputText: gato
- swipe:
    start: 50%, 45%
    end: 50%, 15%
    duration: 500
- scrollUntilVisible:
    element:
      id: term-notes
    direction: DOWN
- tapOn:
    id: term-notes
- assertVisible:
    id: term-notes
    focused: true
- inputText: fieldmemo
- scrollUntilVisible:
    element: Save
    direction: DOWN
- assertVisible: Save
- tapOn: Save
- assertVisible: neko
- assertVisible: '[Gg]ato'
- tapOn: neko
- assertVisible: '[Ff]ieldmemo'
