appId: dev.arial.vocabulaire
---
# Run only on a disposable emulator after placing the review fixture in Downloads.
# Pass -e APPEARANCE=light or -e APPEARANCE=dark and set the emulator's system theme.
- runFlow: review-fixture.yaml
- takeScreenshot: 14-${APPEARANCE}-emulator
- tapOn: Collection tools
- takeScreenshot: 18-${APPEARANCE}-emulator
- tapOn: Export PDF
- assertVisible: 60 terms
- takeScreenshot: 19-${APPEARANCE}-emulator
- tapOn: Create PDF
- assertVisible: PDF ready
- takeScreenshot: 20-${APPEARANCE}-emulator
- tapOn: Share or save PDF
- assertVisible: Sharing 1 file
- back
- tapOn: Done
- tapOn: Filters and display
- takeScreenshot: 21-${APPEARANCE}-emulator
- tapOn: Save current selection
- takeScreenshot: 25-${APPEARANCE}-emulator
- tapOn:
    id: save-filter
- assertVisible: Enter a filter name.
- hideKeyboard
- takeScreenshot: 26-${APPEARANCE}-emulator
- tapOn: Cancel
- tapOn: Display
- takeScreenshot: 22-${APPEARANCE}-emulator
- tapOn: Detailed view
- tapOn: Apply
- takeScreenshot: 15-${APPEARANCE}-emulator
- tapOn: Filters and display
- tapOn: Saved filters
- takeScreenshot: 23-${APPEARANCE}-emulator
- tapOn: Delete Travel expressions
- takeScreenshot: 27-${APPEARANCE}-emulator
- tapOn: Cancel
- tapOn: Apply Travel expressions
- takeScreenshot: 28-${APPEARANCE}-emulator
- tapOn: 'flâner dans les rues.*'
- takeScreenshot: 29-${APPEARANCE}-emulator
- tapOn: 'Actions for flâner.*'
- takeScreenshot: 30-${APPEARANCE}-emulator
- tapOn: Delete
- takeScreenshot: 31-${APPEARANCE}-emulator
- back
- tapOn: Edit term
- takeScreenshot: 33-${APPEARANCE}-emulator
- back
- back
- tapOn: Add term
- takeScreenshot: 32-${APPEARANCE}-emulator
- tapOn: Save
- assertVisible: Enter an expression.
- hideKeyboard
- takeScreenshot: 34-${APPEARANCE}-emulator
- tapOn:
    id: term-original
- inputText: Unsaved
- hideKeyboard
- back
- takeScreenshot: 35-${APPEARANCE}-emulator
- tapOn: Discard
- tapOn: Search vocabulary
- eraseText
- inputText: no-matching-term
- hideKeyboard
- takeScreenshot: 17-${APPEARANCE}-emulator
- tapOn: Clear search and filters
- tapOn: Collection tools
- tapOn: Word of the day
- assertVisible: Open term
- takeScreenshot: 42-${APPEARANCE}-emulator
- tapOn: Open term
- assertVisible: Edit term
- back
- back
- back
- tapOn: Open Empty notebook
- takeScreenshot: 16-${APPEARANCE}-emulator
- tapOn: Collection tools
- tapOn: Word of the day
- assertVisible: Add 5 more terms
- takeScreenshot: 43-${APPEARANCE}-emulator
- back
- tapOn: Filters and display
- tapOn: Saved filters
- assertVisible: No saved filters yet.
- takeScreenshot: 24-${APPEARANCE}-emulator
- tapOn: Cancel
- tapOn: Collection tools
- tapOn: Manage categories
- assertVisible: No categories yet.
- takeScreenshot: 37-${APPEARANCE}-emulator
