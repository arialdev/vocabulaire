name: React Native CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test --runInBand --coverage
      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_HOST_URL: https://sonarcloud.io

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 26.0.2.1+1
      - run: pnpm install --frozen-lockfile
      - name: Generate Android project
        run: CI=1 EXPO_OFFLINE=1 pnpm exec expo prebuild --platform android --no-install
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Build standalone Android APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64
      - name: Install Maestro
        run: |
          curl -fsSL https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.12.0/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android emulator smoke test
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 37.0
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install android/app/build/outputs/apk/release/app-release.apk
            maestro test .maestro/first-collection.yaml
