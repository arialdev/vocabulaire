name: Release Android

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [stable, beta]
        default: stable
        required: true
      source_sha:
        description: Optional full SHA from main
        type: string
        required: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      version: ${{ steps.prepare.outputs.version }}
      version_code: ${{ steps.prepare.outputs.version_code }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Install git-cliff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.14.2 --repo orhun/git-cliff --pattern 'git-cliff-2.14.2-x86_64-unknown-linux-gnu.tar.gz' --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/git-cliff-2.14.2-x86_64-unknown-linux-gnu.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/git-cliff-2.14.2" >> "$GITHUB_PATH"
      - name: Resolve release
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_SOURCE: ${{ inputs.source_sha }}
          RELEASE_CLIFF_CONFIG: ${{ runner.temp }}/cliff.toml
        run: |
          cp cliff.toml "$RELEASE_CLIFF_CONFIG"
          cp scripts/prepare-android-release.sh "$RUNNER_TEMP/prepare-android-release.sh"
          bash "$RUNNER_TEMP/prepare-android-release.sh"
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  build:
    needs: prepare
    uses: ./.github/workflows/pipeline.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      release_version: ${{ needs.prepare.outputs.version }}
      version_code: ${{ fromJSON(needs.prepare.outputs.version_code) }}
    secrets: inherit

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android-release-${{ needs.prepare.outputs.source_sha }}
          path: android-artifact
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          apk_name="vocabulaire-$RELEASE_VERSION.apk"
          (cd android-artifact && sha256sum --check SHA256SUMS)
          mv android-artifact/vocabulaire-release.apk "android-artifact/$apk_name"
          (cd android-artifact && sha256sum "$apk_name" > SHA256SUMS)
          options=()
          if [[ "$RELEASE_CHANNEL" == beta ]]; then
            options+=(--prerelease --latest=false)
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$SOURCE_SHA" > /dev/null
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Vocabulaire $RELEASE_VERSION" --notes-file notes/release-notes.md "${options[@]}" \
            "android-artifact/$apk_name" android-artifact/SHA256SUMS android-artifact/build-info.txt
