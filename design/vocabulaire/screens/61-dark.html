<!-- Mobile Android Artboard 390x892 -->
<div class="w-full max-w-[390px] h-[892px] bg-[#171E1B] flex flex-col relative overflow-hidden shadow-2xl sm:rounded-[36px] border border-border-subtle/30">

<div class="w-full h-11 px-6 flex justify-between items-center text-text-main text-xs font-medium select-none shrink-0 z-20">
<span class="font-secondary-medium text-secondary-medium text-text-main font-semibold tracking-tight">09:41</span>
<div class="flex items-center space-x-2 text-text-main">
<span class="material-symbols-outlined text-[17px] leading-none" data-icon="signal_cellular_alt">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[17px] leading-none" data-icon="wifi">wifi</span>
<span class="material-symbols-outlined text-[17px] leading-none" data-icon="battery_full">battery_full</span>
</div>
</div>
<!-- Top App Bar -->
<header class="w-full h-14 px-4 flex items-center justify-between border-b border-border-subtle shrink-0 bg-[#171E1B] z-10">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full text-text-main hover:bg-surface-recessed transition-colors" type="button">
<span class="material-symbols-outlined text-2xl" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-section-heading text-section-heading text-text-main tracking-tight font-medium">
        Edit term
      </h1>
<button aria-label="More options" class="w-10 h-10 flex items-center justify-center rounded-full text-text-main hover:bg-surface-recessed transition-colors" type="button">
<span class="material-symbols-outlined text-2xl" data-icon="more_vert">more_vert</span>
</button>
</header>
<!-- Scrollable Main Content -->
<main class="flex-1 overflow-y-auto px-6 py-5 space-y-5 overscroll-contain">
<!-- Field: Original expression -->
<div class="space-y-1.5">
<div class="flex items-center justify-between">
<label class="font-secondary-medium text-secondary-medium text-text-secondary" for="headword-input">
            Original expression <span class="text-text-secondary/60">· Required</span>
</label>
</div>
<div class="h-14 px-4 bg-surface-recessed border border-border-subtle rounded-xl flex items-center focus-within:border-primary-container focus-within:ring-1 focus-within:ring-primary-container transition-all">
<input class="w-full bg-transparent border-none p-0 font-entry-headword text-entry-headword text-text-main placeholder-text-secondary/40 focus:outline-none focus:ring-0 italic" id="headword-input" type="text" value="flâner"/>
</div>
</div>
<!-- Field: Translation -->
<div class="space-y-1.5">
<div class="flex items-center justify-between">
<label class="font-secondary-medium text-secondary-medium text-text-secondary" for="translation-input">
            Translation <span class="text-text-secondary/60">· Required</span>
</label>
</div>
<div class="h-14 px-4 bg-surface-recessed border border-border-subtle rounded-xl flex items-center focus-within:border-primary-container focus-within:ring-1 focus-within:ring-primary-container transition-all">
<input class="w-full bg-transparent border-none p-0 font-body-default text-body-default text-text-main placeholder-text-secondary/40 focus:outline-none focus:ring-0" id="translation-input" type="text" value="to wander without hurry"/>
</div>
</div>

<div class="flex items-center justify-between">
<span class="font-secondary-medium text-secondary-medium text-text-secondary">
            Pronunciation <span class="text-text-secondary/60">· Optional</span>
</span>
<span class="font-label-small text-label-small text-text-secondary/70">
            Max 7 seconds
          </span>
</div>
<div class="bg-surface-sheet border border-border-subtle rounded-xl p-4 space-y-3 shadow-sm">
<div class="flex items-center justify-between">
<div class="flex items-center space-x-2.5">
<span class="relative flex h-2.5 w-2.5">
<span class="animate-subtle-pulse absolute inline-flex h-full w-full rounded-full bg-primary-container opacity-75"></span>
<span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-primary-container"></span>
</span>
<span class="font-body-medium text-body-medium text-text-main">

              </span>
</div>
<span class="font-secondary-medium text-secondary-medium text-text-secondary tabular-nums">

<div class="w-full h-1.5 bg-surface-recessed rounded-full overflow-hidden border border-border-subtle/50">

</div>

<p class="font-secondary text-secondary text-text-secondary/80 leading-snug pt-0.5">

</label>
</div>

</div>
</div>

<div class="flex items-center justify-between">
<span class="font-secondary-medium text-secondary-medium text-text-secondary">

<span class="material-symbols-outlined text-[18px] leading-none" data-icon="add">add</span>
<span>New category</span>
</button>
</div>
<div class="flex flex-wrap items-center gap-2">

<div class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-chip-grammatical-fill border border-border-subtle/40 text-chip-grammatical-text">
<span class="font-label-small text-label-small font-semibold tracking-tight">Aa</span>

<button aria-disabled="true" class="w-full h-14 rounded-xl bg-[#2A3830] text-[#7D9383] border border-border-subtle/40 font-button-text text-button-text flex items-center justify-center space-x-2 cursor-not-allowed select-none" disabled="" type="button">
<span class="material-symbols-outlined text-xl leading-none text-[#7D9383]" data-icon="check">check</span>
<span>Save changes</span>
</button>

<button class="w-full h-12 rounded-xl text-text-secondary hover:text-text-main font-button-text text-button-text flex items-center justify-center transition-colors" type="button">
        Cancel

</footer>

<div class="w-full h-4 pb-2 flex justify-center items-center shrink-0 bg-[#171E1B]">
