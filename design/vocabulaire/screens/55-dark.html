<body class="bg-[#171E1B] text-text-main min-h-screen flex items-center justify-center p-0 m-0">
<!-- Android Artboard Shell (390 x 892 standard dp framing) -->
<div class="relative w-full max-w-[390px] h-[892px] bg-[#171E1B] flex flex-col justify-between overflow-hidden select-none">
<!-- Top System Architecture -->
<header class="w-full flex-shrink-0 z-10">
<!-- 1. Native Android Status Bar (24dp / h-6) -->
<div class="h-6 w-full px-6 pt-2 flex items-center justify-between text-text-secondary">
<span class="text-xs font-medium tracking-tight font-secondary-medium text-text-main">09:41</span>
<div class="flex items-center space-x-2 text-[14px]">
<span class="material-symbols-outlined text-[16px] leading-none" data-icon="network_wifi">network_wifi</span>
<span class="material-symbols-outlined text-[16px] leading-none" data-icon="signal_cellular_4_bar">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[16px] leading-none" data-icon="battery_full">battery_full</span>
</div>
</div>
<!-- 2. TopAppBar (Shared Component implementation) -->
<div class="flex items-center w-full px-gutter max-w-[480px] mx-auto h-14 bg-surface dark:bg-surface">
<button aria-label="Navigate back" class="p-2 -ml-2 rounded-full text-primary dark:text-inverse-primary hover:bg-thematic-fill-light dark:hover:bg-surface-variant transition-colors active:scale-[0.99] transition-transform duration-150 flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-2xl text-text-main" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="ml-2 font-page-title text-section-heading font-semibold text-text-main tracking-normal">
          Flashcard practice
        </h1>
</div>
</header>
<!-- 3. Primary Content Area: Field Notebook Minimal Card Canvas -->
<main class="flex-1 w-full px-gutter flex flex-col justify-start pt-6">
<!-- Compact Revealed Flashcard Card -->
<div aria-label="Flashcard: flâner. Click to toggle translation visibility." class="w-full bg-[#222D27] border border-[#45574A] rounded-3xl p-6 sm:p-7 flex flex-col items-start text-left cursor-pointer transition-colors active:scale-[0.99] focus:outline-none" id="flashcard" role="button" tabindex="0">
<!-- Headword (EB Garamond) -->
<h2 class="font-entry-headword text-[30px] leading-[36px] font-normal text-text-main tracking-tight">
          flâner
        </h2>
<!-- Translation (Revealed State) -->
<p class="font-body-default text-body-default text-text-main mt-3 leading-relaxed" id="translation-text">
          to wander without hurry
        </p>
<!-- Secondary Toggle Cue -->
<span class="font-secondary-medium text-secondary-medium text-text-secondary mt-5 hover:text-text-main transition-colors" id="toggle-label">
          Hide translation
        </span>
</div>
</main>
<!-- 4. Bottom Area (Pinned Primary Action & Android Navigation Bar) -->
<footer class="w-full px-gutter pb-4 flex flex-col items-center flex-shrink-0 z-10">
<!-- Primary Action Button: 'Next' -->
<button class="w-full h-14 rounded-full bg-primary-container hover:opacity-95 active:scale-[0.99] transition-transform flex items-center justify-center text-[#173824] font-button-text text-button-text font-medium" type="button">
        Next
      </button>
<!-- Android Navigation Gesture Bar Handle -->
<div class="w-full pt-4 pb-1 flex justify-center items-center">
<div class="w-28 h-1 bg-[#45574A] rounded-full"></div>
</div>
</footer>
</div>
<!-- Interactive State Script (Card Tap Toggle) -->
<script>
    const flashcard = document.getElementById('flashcard');
    const translationText = document.getElementById('translation-text');
    const toggleLabel = document.getElementById('toggle-label');

    let isRevealed = true;

    flashcard.addEventListener('click', () => {
      isRevealed = !isRevealed;
      if (isRevealed) {
        translationText.style.display = 'block';
        toggleLabel.textContent = 'Hide translation';
      } else {
        translationText.style.display = 'none';
        toggleLabel.textContent = 'Show translation';
      }
    });

    flashcard.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        flashcard.click();
      }
    });
  </script>
