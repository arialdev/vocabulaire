<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>16 Vocabulary empty — Dark</title>
<!-- Google Fonts: EB Garamond (headlines/display) & DM Sans (body/labels) -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&amp;family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            canvas: "#171E1B",
            surface: "#222D27",
            recessed: "#1C2520",
            main: "#F3F0E7",
            secondary: "#B8C6BC",
            divider: "#45574A",
            primary: "#B9D8BB",
            "on-primary": "#173824",
            selected: "#2B3C32",
            clay: "#D4A373",
            "clay-fill": "#362B24"
          },
          borderRadius: {
            DEFAULT: "0.5rem",
            lg: "1rem",
            xl: "1.5rem",
            full: "9999px"
          },
          fontFamily: {
            headline: ["EB Garamond", "serif"],
            display: ["EB Garamond", "serif"],
            body: ["DM Sans", "sans-serif"],
            label: ["DM Sans", "sans-serif"]
          }
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      line-height: 1;
      display: inline-block;
      vertical-align: middle;
    }
    body {
      background-color: #0F1412;
      font-family: 'DM Sans', sans-serif;
      margin: 0;
      padding: 0;
      color: #F3F0E7;
      -webkit-font-smoothing: antialiased;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-0 sm:p-4 select-none">
<!-- Android Artboard (412 x 892 pt) -->
<div class="relative w-full max-w-[412px] h-[892px] bg-canvas text-main flex flex-col justify-between overflow-hidden shadow-2xl sm:rounded-[32px] border border-divider">
<!-- Top System & App Bar Container -->
<header class="w-full flex-shrink-0 z-10">
<!-- Android Status Bar (24dp height) -->
<div class="flex items-center justify-between px-6 pt-3 pb-1 text-xs text-main/80 font-medium tracking-tight">
<span>9:41</span>
<div class="flex items-center space-x-1.5 opacity-80">
<span class="material-symbols-outlined text-[16px]" data-icon="signal_cellular_alt">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[16px]" data-icon="wifi">wifi</span>
<span class="material-symbols-outlined text-[16px]" data-icon="battery_full">battery_full</span>
</div>
</div>
<!-- App Bar (56dp height) -->
<div class="flex justify-between items-center h-14 px-4 w-full">
<!-- Leading Action: Back -->
<button aria-label="Back to Collections" class="w-12 h-12 flex items-center justify-center rounded-full text-main hover:bg-white/5 active:bg-white/10 transition-colors" type="button">
<span class="material-symbols-outlined text-[24px]" data-icon="arrow_back">arrow_back</span>
</button>
<!-- Collection Headline -->
<h1 class="flex-1 px-2 font-headline font-semibold text-[24px] leading-[30px] text-main truncate tracking-normal">
          🍋 Español de viaje
        </h1>
<!-- Trailing Action: Overflow -->
<button aria-label="Collection options" class="w-12 h-12 flex items-center justify-center rounded-full text-secondary hover:text-main hover:bg-white/5 active:bg-white/10 transition-colors" type="button">
<span class="material-symbols-outlined text-[24px]" data-icon="more_vert">more_vert</span>
</button>
</div>
<!-- Search & Filters Strip -->
<div class="px-6 pt-2 pb-1 space-y-2">
<!-- Recessed Search Input -->
<div class="relative w-full flex items-center">
<span class="material-symbols-outlined absolute left-4 text-secondary text-[20px] pointer-events-none" data-icon="search">search</span>
<input aria-disabled="true" class="w-full h-[48px] pl-11 pr-4 bg-recessed rounded-[12px] border border-divider text-[15px] text-secondary placeholder:text-secondary/60 focus:outline-none cursor-not-allowed opacity-90 font-normal" disabled="" placeholder="Search words, translations &amp; notes" type="text"/>
</div>
<!-- Subtle Filters Action (Result counts and density hidden in empty state) -->
<div class="flex justify-end items-center pt-0.5">
<button class="inline-flex items-center gap-1.5 text-xs text-secondary/80 font-medium py-1 px-2 rounded hover:text-main transition-colors" type="button">
<span class="material-symbols-outlined text-[16px]" data-icon="tune">tune</span>
<span>Filters &amp; display</span>
</button>
</div>
</div>
</header>
<!-- Empty State Centerpiece (Flexible Area) -->
<main class="flex-1 flex flex-col items-center justify-center px-8 text-center -mt-6">
<!-- Minimalist Notebook / Index Card Illustration -->
<div class="w-32 h-32 mb-6 flex items-center justify-center">
<svg aria-hidden="true" class="w-24 h-24 stroke-[1.4]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewbox="0 0 120 120">
<!-- Background angled index card -->
<rect class="stroke-divider" height="58" rx="4" stroke-dasharray="3 3" width="76" x="24" y="20"></rect>
<!-- Foreground primary index card / notebook page -->
<rect class="fill-[#1F2B24] stroke-secondary/70" height="64" rx="4" width="84" x="18" y="32"></rect>
<!-- Bookmark or binder margin perforation / line -->
<line class="stroke-divider" x1="32" x2="32" y1="32" y2="96"></line>
<!-- Ruled lines on stationery -->
<line class="stroke-primary/70" x1="42" x2="88" y1="48" y2="48"></line>
<line class="stroke-secondary/50" x1="42" x2="78" y1="60" y2="60"></line>
<line class="stroke-secondary/40" x1="42" x2="70" y1="72" y2="72"></line>
<!-- Small corner fold accent -->
<path class="stroke-secondary/60" d="M94 88 L102 96"></path>
<circle class="fill-secondary/50 stroke-none" cx="25" cy="40" r="1.5"></circle>
<circle class="fill-secondary/50 stroke-none" cx="25" cy="64" r="1.5"></circle>
<circle class="fill-secondary/50 stroke-none" cx="25" cy="88" r="1.5"></circle>
</svg>
</div>
<!-- Human Headline in EB Garamond -->
<h2 class="font-headline font-semibold text-[24px] leading-[30px] text-main mb-2 tracking-normal">
        A new word is a good beginning.
      </h2>
<!-- Quiet, Considerate Copy in DM Sans -->
<p class="font-body text-[15px] leading-[22px] text-secondary max-w-[280px]">
        Add an expression and its translation. The rest can come later.
      </p>
</main>
<!-- Bottom Action Zone -->
<footer class="w-full flex-shrink-0 px-6 pb-2 pt-2 z-10">
<!-- Primary Action: + Add your first term -->
<button class="w-full h-14 bg-primary text-on-primary rounded-[12px] font-label font-medium text-[16px] tracking-normal flex items-center justify-center gap-2 shadow-sm hover:opacity-95 active:opacity-90 transition-opacity" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="add">add</span>
<span>Add your first term</span>
</button>
<!-- Android Gesture Navigation Inset (16dp height area) -->
<div class="w-full h-4 mt-3 flex items-center justify-center">
<div class="w-[72px] h-[4px] bg-main/30 rounded-full"></div>
</div>
</footer>
</div>
</body></html>
