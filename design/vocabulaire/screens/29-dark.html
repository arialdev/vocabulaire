<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>29 Term details — Dark</title>
<!-- Google Fonts: EB Garamond & DM Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&amp;family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            canvas: '#171E1B',
            surface: '#222D27',
            recessed: '#1C2520',
            mainText: '#F3F0E7',
            secondaryText: '#B8C6BC',
            borderGreen: '#45574A',
            actionFill: '#B9D8BB',
            onAction: '#173824',
            chipGrammarBg: '#49362D',
            chipGrammarText: '#F3C3AA',
            chipThematicBg: '#344D3A',
            chipThematicText: '#C1DFC4'
          },
          fontFamily: {
            serif: ['"EB Garamond"', 'serif'],
            sans: ['"DM Sans"', 'sans-serif']
          }
        }
      }
    };
  </script>
<!-- Core Styles -->
<style data-purpose="typography-and-reset">
    body {
      font-family: 'DM Sans', sans-serif;
      background-color: #171E1B;
      color: #F3F0E7;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
  </style>
</head>
<body class="bg-canvas text-mainText flex justify-center min-h-screen">
<!-- Mobile Container: Android 412x892 standard viewport bleed -->
<div class="w-full max-w-[412px] min-h-[892px] flex flex-col justify-between relative bg-canvas select-none">
<!-- Top Flow Container (Status bar, App bar, Term content) -->
<div class="flex flex-col w-full">
<!-- BEGIN: StatusBar -->
<section class="w-full h-11 px-6 pt-3 pb-1 flex items-center justify-between text-xs text-mainText font-medium" data-purpose="status-bar">
<!-- System Time -->
<span class="tracking-tight text-[14px]">9:41</span>
<!-- System Icons -->
<div class="flex items-center space-x-2 text-mainText">
<span class="material-symbols-outlined text-[17px]">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[17px]">wifi</span>
<span class="material-symbols-outlined text-[18px]">battery_full</span>
</div>
</section>
<!-- END: StatusBar -->
<!-- BEGIN: AppBar -->
<header class="w-full h-14 px-4 flex items-center justify-between border-b border-borderGreen/20" data-purpose="app-bar">
<!-- Navigation Back Button -->
<button aria-label="Go back" class="p-2 -ml-2 rounded-full hover:bg-surface transition-colors flex items-center justify-center text-mainText">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<!-- Screen Title -->
<h1 class="text-base font-medium flex items-center gap-1.5 text-mainText tracking-normal">
<span>Everyday French</span>
<span aria-label="coffee" class="text-base" role="img">☕</span>
</h1>
<!-- Overflow Menu Button -->
<button aria-label="More options" class="p-2 -mr-2 rounded-full hover:bg-surface transition-colors flex items-center justify-center text-mainText">
<span class="material-symbols-outlined text-2xl">more_vert</span>
</button>
</header>
<!-- END: AppBar -->
<!-- BEGIN: TermDetailsContent -->
<main class="px-6 pt-6 pb-4 flex flex-col" data-purpose="term-details-content">
<!-- Collection Reference Badge -->
<div class="self-start">
<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-recessed text-xs text-secondaryText border border-borderGreen/40 font-medium">
<span class="text-xs">☕</span>
<span>Everyday French</span>
<span class="text-[10px] text-borderGreen">•</span>
<span>Term #14</span>
</span>
</div>
<!-- Term Headword & Translation -->
<div class="mt-4">
<h2 class="font-serif text-[42px] leading-tight font-normal text-mainText tracking-tight">flâner</h2>
<p class="font-sans text-lg text-secondaryText font-normal mt-1 leading-normal">to wander without hurry</p>
</div>
<!-- Horizontal Divider -->
<hr class="border-t border-borderGreen my-6 opacity-70"/>
<!-- Contextual Notes Card -->
<div class="bg-surface border border-borderGreen rounded-2xl p-4 shadow-sm" data-purpose="notes-card">
<span class="text-[11px] font-medium uppercase tracking-wider text-secondaryText block mb-2">Notes</span>
<blockquote class="text-[15px] italic text-mainText leading-relaxed">
            “On a quiet Sunday, with no destination in mind.”
          </blockquote>
</div>
<!-- Categories Section -->
<section class="mt-7" data-purpose="categories-section">
<h3 class="text-sm font-medium text-secondaryText mb-3">Categories</h3>
<div class="flex flex-wrap gap-2.5 items-center">
<!-- Grammatical Tag Chip -->
<span class="inline-flex items-center px-3.5 py-1.5 rounded-full text-xs font-medium bg-chipGrammarBg text-chipGrammarText tracking-wide">
              Aa Verb
            </span>
<!-- Thematic Tag Chip -->
<span class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-medium bg-chipThematicBg text-chipThematicText tracking-wide">
<span class="material-symbols-outlined text-[15px]">eco</span>
              Everyday life
            </span>
</div>
</section>
</main>
<!-- END: TermDetailsContent -->
</div>
<!-- Bottom Actions Container (Footnote, Action Button, Gesture Bar) -->
<footer class="w-full px-6 pb-2 pt-4 flex flex-col gap-5" data-purpose="bottom-container">
<!-- Sync Footnote -->
<div class="flex items-center justify-center gap-2 text-xs text-secondaryText" data-purpose="metadata-footnote">
<span class="material-symbols-outlined text-[16px] text-secondaryText">cloud_off</span>
<span>Added Oct 2024 · Stored offline on device</span>
</div>
<!-- BEGIN: PrimaryAction -->
<div class="w-full" data-purpose="action-button-wrapper">
<button class="w-full bg-actionFill text-onAction hover:brightness-105 active:scale-[0.99] font-medium text-base py-4 rounded-xl flex items-center justify-center gap-2 transition-all shadow-md">
<span class="material-symbols-outlined text-[20px]">edit</span>
<span>Edit term</span>
</button>
</div>
<!-- END: PrimaryAction -->
<!-- Android Native Gesture Indicator -->
<div class="w-full flex justify-center py-2" data-purpose="gesture-indicator-container">
<div class="w-32 h-1 bg-borderGreen rounded-full"></div>
</div>
</footer>
</div>
</body></html>
