<body class="bg-surface text-main-text-light antialiased min-h-screen flex justify-center selection:bg-secondary-container">
<!-- Android Canvas Container (Max 480px, responsive) -->
<main class="w-full max-w-[480px] min-h-screen flex flex-col justify-between relative bg-surface">
<!-- Top Section: Status Bar & TopAppBar -->
<header class="w-full">
<!-- Standard Android Status Bar -->
<div class="w-full h-10 px-gutter flex items-center justify-between text-main-text-light select-none pt-1">
<span class="font-body-medium text-secondary text-main-text-light">22:37</span>
<div class="flex items-center space-x-1.5 text-main-text-light">
<span class="material-symbols-outlined text-[17px] leading-none">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[17px] leading-none">wifi</span>
<span class="material-symbols-outlined text-[20px] leading-none font-bold">battery_full</span>
</div>
</div>
<!-- TopAppBar (from Shared Components JSON: docked h-14, 24dp horizontal padding) -->
<div class="flex items-center w-full px-gutter max-w-[480px] mx-auto h-14 bg-surface shadow-none select-none">
<button aria-label="Back" class="w-12 h-12 -ml-3 flex items-center justify-center rounded-full text-primary hover:bg-thematic-fill-light active:scale-[0.99] transition-transform duration-150 focus:outline-none" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="ml-1 text-section-heading font-section-heading text-main-text-light tracking-tight">Flashcard practice</h1>
</div>
</header>
<!-- Main Content Canvas (Standard 24dp Margins) -->
<div class="flex-1 w-full px-gutter pt-3 pb-6 flex flex-col">
<!-- Hidden Card: Compact, 24dp radius, subtle border, stationery ivory fill -->
<article class="w-full bg-surface-light border border-border-light rounded-2xl p-7 flex flex-col items-start transition-all duration-200 cursor-pointer active:scale-[0.99] select-none" id="flashcard">
<!-- Large Headword (EB Garamond) -->
<h2 class="text-entry-headword font-entry-headword text-main-text-light tracking-tight">flâner</h2>
<!-- Hidden Translation Container (Revealed via interactive toggle) -->
<div class="hidden mt-3 mb-1" id="translation-container">
<p class="text-body font-body text-main-text-light">to stroll leisurely, to roam aimlessly</p>
</div>
<!-- Quiet Secondary Toggle Action -->
<button class="mt-4 text-secondary font-secondary text-secondary-text-light hover:text-main-text-light transition-colors focus:outline-none text-left" id="toggle-btn" type="button">
          Show translation
        </button>
</article>
</div>
<!-- Bottom Thumb Zone Actions & Android Navigation Bar -->
<footer class="w-full px-gutter pb-3 flex flex-col">
<!-- Disabled Primary Button: Muted light grayish green background, disabled styling -->
<button aria-disabled="true" class="w-full h-14 rounded-2xl bg-secondary-container/50 text-secondary-text-light font-body-medium text-body-medium flex items-center justify-center cursor-not-allowed select-none transition-colors duration-150" disabled="" id="next-btn" type="button">
        Next
      </button>
<!-- Standard Android Gesture Navigation Bar -->
<div class="w-full h-6 flex items-center justify-center pt-2">
<div class="w-28 h-1 bg-main-text-light/80 rounded-full"></div>
</div>
</footer>
</main>
<!-- Interactive script for state toggle (Minimal enhancement) -->
<script>
    const card = document.getElementById('flashcard');
    const toggleBtn = document.getElementById('toggle-btn');
    const translation = document.getElementById('translation-container');
    const nextBtn = document.getElementById('next-btn');

    let isRevealed = false;

    function handleToggle(e) {
      if (e) e.stopPropagation();
      isRevealed = !isRevealed;
      if (isRevealed) {
        translation.classList.remove('hidden');
        toggleBtn.textContent = 'Hide translation';
        // Enable Next button when card is inspected
        nextBtn.removeAttribute('disabled');
        nextBtn.setAttribute('aria-disabled', 'false');
        nextBtn.classList.remove('bg-secondary-container/50', 'text-secondary-text-light', 'cursor-not-allowed');
        nextBtn.classList.add('bg-primary', 'text-on-primary', 'cursor-pointer', 'active:scale-[0.99]');
      } else {
        translation.classList.add('hidden');
        toggleBtn.textContent = 'Show translation';
        // Return to disabled state
        nextBtn.setAttribute('disabled', 'true');
        nextBtn.setAttribute('aria-disabled', 'true');
        nextBtn.classList.remove('bg-primary', 'text-on-primary', 'cursor-pointer', 'active:scale-[0.99]');
        nextBtn.classList.add('bg-secondary-container/50', 'text-secondary-text-light', 'cursor-not-allowed');
      }
    }

    card.addEventListener('click', handleToggle);
  </script>
