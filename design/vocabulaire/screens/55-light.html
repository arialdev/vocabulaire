<body class="bg-canvas-light text-main-text-light antialiased min-h-screen flex justify-center items-center selection:bg-thematic-fill-light selection:text-thematic-text-light font-body">
<!-- Mobile Device Frame Container -->
<main class="w-full max-w-[440px] min-h-screen flex flex-col justify-between bg-canvas-light relative overflow-hidden">
<div>
<!-- Android Native Status Bar -->
<div class="w-full h-11 px-gutter flex items-center justify-between text-main-text-light select-none pt-2">
<span class="font-body-medium text-body-medium text-main-text-light">13:41</span>
<div class="flex items-center space-x-2">
<span class="material-symbols-outlined text-[18px] text-main-text-light">wifi</span>
<span class="material-symbols-outlined text-[20px] text-main-text-light" style="font-variation-settings: 'FILL' 1;">battery_full</span>
</div>
</div>
<!-- TopAppBar Component as specified in Shared Components JSON -->
<header class="bg-surface docked full-width top-0 h-14 shadow-none">
<div class="flex items-center w-full px-gutter max-w-[480px] mx-auto h-14">
<button aria-label="Back" class="w-12 h-12 -ml-3 flex items-center justify-center rounded-full text-primary hover:bg-thematic-fill-light active:scale-[0.99] transition-transform duration-150" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="ml-2 font-section-heading text-section-heading text-main-text-light">Flashcard practice</h1>
</div>
</header>
<!-- Main Flashcard Workspace -->
<div class="px-gutter pt-3">
<!-- Interactive Compact Flashcard Container -->
<article class="bg-surface-light border border-border-light rounded-2xl p-[28px] transition-all duration-200 select-none cursor-pointer active:scale-[0.99] shadow-none" id="flashcard">
<!-- Headword Presentation -->
<h2 class="font-entry-headword text-entry-headword text-main-text-light mb-3">flâner</h2>
<!-- Translation / Meaning block -->
<div class="transition-all duration-200" id="translation-section">
<p class="font-body text-body text-main-text-light mb-5" id="translation-text">to wander without hurry</p>
</div>
<!-- Secondary Quiet Toggle Action Text/Button -->
<button class="font-secondary text-secondary text-secondary-text-light hover:text-main-text-light p-0 transition-colors focus:outline-none text-left" id="toggle-action" type="button">
            Hide translation
          </button>
</article>
</div>
</div>
<!-- Bottom Thumb Zone & Native Navigation -->
<div class="px-gutter pb-3 pt-6 flex flex-col items-center">
<!-- Full-Width Primary Action Button (Next) -->
<button class="w-full h-14 bg-primary-container hover:bg-primary text-on-primary font-body-medium text-body-medium rounded-2xl flex items-center justify-center transition-all duration-150 active:scale-[0.99] shadow-none" type="button">
        Next
      </button>
<!-- Android Standard Gesture Bar -->
<div class="w-full flex justify-center items-center pt-5 pb-2">
<div class="w-36 h-1 bg-main-text-light/40 rounded-full"></div>
</div>
</div>
</main>
<!-- Interactive State Logic -->
<script>
    const toggleButton = document.getElementById('toggle-action');
    const translationText = document.getElementById('translation-text');
    let isTranslationVisible = true;

    toggleButton.addEventListener('click', (e) => {
      e.stopPropagation();
      isTranslationVisible = !isTranslationVisible;
      
      if (isTranslationVisible) {
        translationText.style.display = 'block';
        toggleButton.innerText = 'Hide translation';
      } else {
        translationText.style.display = 'none';
        toggleButton.innerText = 'Show translation';
      }
    });
  </script>
</body></html>
