<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=412, height=892, initial-scale=1.0, user-scalable=no" name="viewport"/>
<title>30 Term actions — Light | Vocabulaire</title>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts: EB Garamond & DM Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&amp;family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            canvas: "#F8F5EE",
            surface: "#FFFCF6",
            recessed: "#F0EDE5",
            main: "#20382E",
            secondary: "#59675E",
            divider: "#D8DED2",
            primary: "#2D6046",
            "on-primary": "#FFFFFF",
            "selected-surface": "#E2ECDF",
            "grammatical-text": "#684435",
            "grammatical-fill": "#F1E5DC",
            "thematic-text": "#345B43",
            "thematic-fill": "#E2ECDF",
            destructive: "#A53532",
            "error-surface": "#FBE6E1"
          },
          borderRadius: {
            DEFAULT: "0.5rem",
            lg: "1rem",
            xl: "1.5rem",
            full: "9999px"
          },
          fontFamily: {
            headline: ["EB Garamond", "serif"],
            display: ["EB Garamond", "serif"],
            body: ["DM Sans", "sans-serif"],
            label: ["DM Sans", "sans-serif"]
          }
        }
      }
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      line-height: 1;
      display: inline-block;
      user-select: none;
    }
    body {
      background-color: #ECE8DE;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: "DM Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="p-0 sm:p-4">
<!-- ARTBOARD CONTAINER: Fixed Android Dimensions 412x892 -->
<main class="relative w-[412px] h-[892px] bg-canvas overflow-hidden shadow-2xl flex flex-col select-none text-main">
<!-- ============================================== -->
<!-- UNDERLYING SCREEN: Term details ("flâner")      -->
<!-- ============================================== -->
<div class="absolute inset-0 flex flex-col bg-canvas z-0">
<!-- Top App Bar (Shared Components Blueprint: 56dp height) -->
<header class="flex justify-between items-center w-full h-14 px-4 bg-surface border-b border-divider shrink-0 z-10">
<button aria-label="Navigate back" class="w-10 h-10 flex items-center justify-center rounded-full text-secondary hover:bg-recessed active:opacity-80 transition-colors" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<span class="font-headline text-2xl font-semibold tracking-normal text-main">Vocabulaire</span>
<button aria-label="More actions" class="w-10 h-10 flex items-center justify-center rounded-full text-secondary hover:bg-recessed active:opacity-80 transition-colors" type="button">
<span class="material-symbols-outlined text-[24px]">more_vert</span>
</button>
</header>
<!-- Vocabulary Details Body Canvas -->
<div class="flex-1 px-6 pt-7 overflow-y-auto">
<!-- Collection Context Meta -->
<div class="flex items-center gap-2 mb-4 text-secondary text-sm font-label font-normal tracking-wide">
<span>☕ Everyday French</span>
<span>·</span>
<span>Added Oct 14</span>
</div>
<!-- Term Headword -->
<h1 class="font-headline text-[38px] leading-[44px] font-semibold text-main mb-2">flâner</h1>
<!-- Phonetic / Part of speech whisper -->
<!-- Translation Block -->
<div class="pb-6 mb-6 border-b border-divider">
<span class="block text-xs uppercase tracking-wider text-secondary font-medium mb-1 font-label">Translation</span>
<p class="font-body text-xl font-normal text-main leading-relaxed">to wander without hurry</p>
</div>
<!-- Notes Block -->
<div class="pb-6 mb-6 border-b border-divider">
<span class="block text-xs uppercase tracking-wider text-secondary font-medium mb-1.5 font-label">Notes &amp; Context</span>
<p class="font-body text-base text-main leading-relaxed">
            On a quiet Sunday, with no destination in mind. Often along the Seine or through leafy alleys.
          </p>
</div>
<!-- Category Tag Chips -->
<div class="mb-8">
<span class="block text-xs uppercase tracking-wider text-secondary font-medium mb-3 font-label">Categories</span>
<div class="flex flex-wrap gap-2.5">
<!-- Grammatical Tag -->
<span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-grammatical-fill text-grammatical-text font-label text-xs font-medium">
<span class="material-symbols-outlined text-[14px]">match_case</span>
              Verb
            </span>
<!-- Thematic Tag -->
<span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-thematic-fill text-thematic-text font-label text-xs font-medium">
<span class="material-symbols-outlined text-[14px]">local_florist</span>
              Everyday life
            </span>
</div>
</div>
</div>
<!-- Bottom Floating / Docked Primary Button (Edit Term Background) -->
<div class="p-6 bg-canvas border-t border-divider">
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-body font-medium text-base flex items-center justify-center gap-2 shadow-sm" type="button">
<span class="material-symbols-outlined text-[20px]">edit</span>
          Edit term
        </button>
</div>
</div>
<!-- ============================================== -->
<!-- 48% DARK SCRIM OVERLAY                         -->
<!-- ============================================== -->
<div aria-hidden="true" class="absolute inset-0 bg-black/48 z-20 backdrop-blur-[0.5px] transition-opacity duration-200"></div>
<!-- ============================================== -->
<!-- STATIONERY BOTTOM SHEET (Term Actions)         -->
<!-- ============================================== -->
<div class="absolute bottom-0 inset-x-0 bg-surface rounded-t-[24px] border-t border-divider shadow-xl z-30 flex flex-col pt-3 pb-2 animate-in slide-in-from-bottom duration-250">
<!-- Drag Handle (40x4dp, rounded, #D8DED2) -->
<div aria-hidden="true" class="w-10 h-1 bg-divider rounded-full mx-auto mb-3 shrink-0"></div>
<!-- Sheet Header -->
<div class="flex items-center justify-between px-6 pb-4 border-b border-divider shrink-0">
<div class="flex flex-col pr-2 overflow-hidden">
<h2 class="font-headline text-[22px] leading-7 font-semibold text-main truncate">
            flâner
          </h2>
<p class="font-body text-xs text-secondary mt-0.5 tracking-normal">
            ☕ Everyday French · 1 term
          </p>
</div>
<button aria-label="Close sheet" class="w-10 h-10 -mr-2 flex items-center justify-center rounded-full text-secondary hover:bg-recessed active:opacity-80 transition-colors" type="button">
<span class="material-symbols-outlined text-[22px]">close</span>
</button>
</div>
<!-- Action List Items (56dp high, generous tap target) -->
<div class="flex flex-col px-4 py-2 divide-y divide-divider">
<!-- Row 1: Edit term -->
<button class="w-full h-14 flex items-center justify-between px-3 text-left rounded-lg hover:bg-recessed active:bg-recessed/80 transition-colors group" type="button">
<div class="flex items-center gap-3.5">
<span class="material-symbols-outlined text-[20px] text-main shrink-0">edit</span>
<span class="font-body text-base font-medium text-main">Edit term</span>
</div>
<span class="material-symbols-outlined text-[20px] text-secondary/60 group-hover:text-secondary group-hover:translate-x-0.5 transition-all">chevron_right</span>
</button>
<!-- Row 2: Delete term (Destructive styling) -->
<button class="w-full h-14 flex items-center justify-between px-3 text-left rounded-lg hover:bg-error-surface/60 active:bg-error-surface transition-colors group" type="button">
<div class="flex items-center gap-3.5">
<span class="material-symbols-outlined text-[20px] text-destructive shrink-0">delete</span>
<span class="font-body text-base font-medium text-destructive">Delete term</span>
</div>
<span class="material-symbols-outlined text-[20px] text-destructive/50 group-hover:text-destructive group-hover:translate-x-0.5 transition-all">chevron_right</span>
</button>
</div>
<!-- Secondary / Cancel Action -->
<div class="px-6 pt-3 pb-3">
<button class="w-full h-14 bg-recessed border border-divider text-main font-body font-medium text-base rounded-xl hover:bg-divider/50 active:scale-[0.99] transition-all flex items-center justify-center" type="button">
          Cancel
        </button>
</div>
<!-- Android System Navigation / Gesture Bar Inset -->
<div class="h-6 w-full flex items-center justify-center shrink-0">
<div aria-hidden="true" class="w-[72px] h-1 bg-main/20 rounded-full"></div>
</div>
</div>
</main>
</body></html>
