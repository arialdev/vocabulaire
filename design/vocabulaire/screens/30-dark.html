<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>30 Term actions — Dark</title>
<!-- Google Fonts: EB Garamond (Serif) & Inter (Sans-serif) -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"EB Garamond"', 'serif'],
            sans: ['"Inter"', 'sans-serif'],
          },
          colors: {
            canvas: '#171E1B',
            surface: '#222D27',
            recessed: '#1C2520',
            mainText: '#F3F0E7',
            secText: '#B8C6BC',
            dividerBorder: '#45574A',
            destructive: '#FFB4AB',
          }
        }
      }
    }
  </script>
<style data-purpose="base-styling">
    body {
      background-color: #171E1B;
      color: #F3F0E7;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="bg-[#171E1B] text-[#F3F0E7] flex justify-center min-h-screen antialiased select-none">
<!-- Mobile Container: 412px Android Viewport Full Bleed -->
<div class="relative w-full max-w-[412px] h-[892px] overflow-hidden flex flex-col bg-[#171E1B]" data-purpose="mobile-viewport">
<!-- BEGIN: BackgroundView (Term Details Screen) -->
<div class="absolute inset-0 flex flex-col pointer-events-none" data-purpose="term-details-background">
<!-- Top App Bar -->
<header class="h-16 px-4 flex items-center justify-between border-b border-[#45574A]/40" data-purpose="app-header">
<button aria-label="Go back" class="p-2 text-[#F3F0E7] rounded-full">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="text-xl font-serif text-[#F3F0E7] tracking-wide">Vocabulaire</h1>
<button aria-label="More options" class="p-2 text-[#F3F0E7] rounded-full">
<span class="material-symbols-outlined text-[24px]">more_vert</span>
</button>
</header>
<!-- Main Term Content -->
<main class="flex-1 px-6 pt-7 space-y-6 overflow-hidden">
<!-- Subtitle / Meta Info -->
<div class="flex items-center space-x-2 text-sm text-[#B8C6BC]">
<span>☕ Everyday French</span>
<span>·</span>
<span>Added Oct 14</span>
</div>
<!-- Term & Phonetics -->
<div class="space-y-1">
<h2 class="text-4xl font-serif text-[#F3F0E7] tracking-tight">flâner</h2>
</div>
<!-- Translation Block -->
<div class="space-y-1.5 pt-2">
<span class="text-[11px] font-semibold tracking-wider uppercase text-[#B8C6BC]/80">TRANSLATION</span>
<p class="text-xl text-[#F3F0E7] font-medium">to wander without hurry</p>
</div>
<hr class="border-[#45574A]/40 my-4"/>
<!-- Notes & Context Block -->
<div class="space-y-1.5">
<span class="text-[11px] font-semibold tracking-wider uppercase text-[#B8C6BC]/80">NOTES &amp; CONTEXT</span>
<p class="text-base text-[#F3F0E7] leading-relaxed">
            On a quiet Sunday, with no destination in mind. Often along the Seine or through leafy alleys.
          </p>
</div>
<hr class="border-[#45574A]/40 my-4"/>
<!-- Categories / Tags -->
<div class="space-y-2.5">
<span class="text-[11px] font-semibold tracking-wider uppercase text-[#B8C6BC]/80">CATEGORIES</span>
<div class="flex gap-2.5">
<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-[#1C2520] text-[#B8C6BC] border border-[#45574A]/50">
<span class="font-serif italic mr-1 text-[#F3F0E7]">Aa</span> Verb
            </span>
<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-[#1C2520] text-[#B8C6BC] border border-[#45574A]/50">
<span class="mr-1">🪴</span> Everyday life
            </span>
</div>
</div>
</main>
</div>
<!-- END: BackgroundView -->
<!-- BEGIN: ScrimOverlay -->
<!-- Dimmed background scrim over the Term details view -->
<div aria-hidden="true" class="absolute inset-0 bg-black/48 z-10 transition-opacity" data-purpose="scrim-overlay"></div>
<!-- END: ScrimOverlay -->
<!-- BEGIN: BottomSheet -->
<!-- Modal actions bottom sheet container -->
<section class="absolute bottom-0 inset-x-0 z-20 bg-[#222D27] rounded-t-3xl border-t border-[#45574A] shadow-2xl flex flex-col pt-3 px-6 pb-2" data-purpose="actions-bottom-sheet">
<!-- Drag Handle -->
<div class="flex justify-center mb-3">
<div class="w-10 h-1 rounded-full bg-[#45574A]"></div>
</div>
<!-- Sheet Header -->
<div class="flex items-start justify-between pb-3" data-purpose="sheet-header">
<div>
<h3 class="text-2xl font-serif text-[#F3F0E7] font-medium leading-tight">flâner</h3>
<p class="text-xs text-[#B8C6BC] mt-0.5">☕ Everyday French · 1 term</p>
</div>
<button aria-label="Close sheet" class="text-[#B8C6BC] hover:text-[#F3F0E7] p-1 -mr-1 transition-colors">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Actions List -->
<div class="flex flex-col" data-purpose="action-items">
<!-- Edit Term Action -->
<button class="w-full flex items-center justify-between py-4 border-b border-[#45574A] text-left group" data-purpose="action-edit">
<div class="flex items-center space-x-3.5">
<span class="material-symbols-outlined text-[#F3F0E7] text-[20px]">edit</span>
<span class="text-base text-[#F3F0E7] font-normal group-hover:translate-x-0.5 transition-transform">Edit term</span>
</div>
<span class="material-symbols-outlined text-[#B8C6BC] text-[18px]">chevron_right</span>
</button>
<!-- Delete Term Action (Destructive) -->
<button class="w-full flex items-center justify-between py-4 text-left group" data-purpose="action-delete">
<div class="flex items-center space-x-3.5">
<span class="material-symbols-outlined text-[#FFB4AB] text-[20px]">delete</span>
<span class="text-base text-[#FFB4AB] font-normal group-hover:translate-x-0.5 transition-transform">Delete term</span>
</div>
<span class="material-symbols-outlined text-[#FFB4AB] text-[18px]">chevron_right</span>
</button>
</div>
<!-- Secondary Action: Cancel Button -->
<button class="w-full py-3.5 mt-2 bg-[#1C2520] border border-[#45574A] rounded-2xl text-[#F3F0E7] font-medium text-sm text-center active:scale-[0.99] transition-transform hover:bg-[#1C2520]/80" data-purpose="action-cancel">
        Cancel
      </button>
<!-- Android Home Bar / Gesture Indicator -->
<div class="flex justify-center pt-5 pb-1" data-purpose="android-gesture-bar">
<div class="w-20 h-1 rounded-full bg-[#B8C6BC]/40"></div>
</div>
</section>
<!-- END: BottomSheet -->
</div>
</body></html>
