<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>43 Daily word insufficient — Light</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&amp;family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            canvas: "#F8F5EE",
            surface: "#FFFCF6",
            recessed: "#F0EDE5",
            main: "#20382E",
            secondary: "#59675E",
            divider: "#D8DED2",
            primary: "#2D6046",
            "on-primary": "#FFFFFF",
            "selected-surface": "#E2ECDF",
            "error-surface": "#FBE6E1",
            "destructive-text": "#A53532"
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "1rem",
            "xl": "1.5rem",
            "full": "9999px"
          },
          fontFamily: {
            headline: ["EB Garamond", "serif"],
            display: ["EB Garamond", "serif"],
            body: ["DM Sans", "sans-serif"],
            label: ["DM Sans", "sans-serif"]
          }
        },
      },
    }
  </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#ECE8DF] min-h-screen flex items-center justify-center p-0 md:p-6 font-body text-main antialiased selection:bg-[#E2ECDF] selection:text-main">
<!-- Android Mobile Frame (412 x 892) -->
<main class="w-[412px] h-[892px] max-w-full max-h-screen bg-canvas rounded-none md:rounded-[36px] shadow-2xl overflow-hidden flex flex-col relative border-0 md:border md:border-divider select-none">
<!-- Top System Status Bar -->
<header class="w-full h-11 pt-2 px-6 flex items-center justify-between text-xs font-medium text-main z-20 shrink-0">
<span class="tracking-tight font-semibold">09:41</span>
<div class="flex items-center space-x-2 text-secondary">
<span class="material-symbols-outlined text-[17px]" data-icon="signal_cellular_alt">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[17px]" data-icon="wifi">wifi</span>
<span class="material-symbols-outlined text-[19px]" data-icon="battery_full">battery_full</span>
</div>
</header>
<!-- Top App Bar (Task-Focused: Sub-page with navigation) -->
<nav aria-label="Top App Bar" class="w-full h-16 px-4 flex items-center justify-between border-b border-divider shrink-0 bg-surface">
<div class="flex items-center gap-3">
<button aria-label="Back to collection" class="w-11 h-11 -ml-1 rounded-full flex items-center justify-center text-main hover:bg-recessed active:opacity-80 transition-colors" type="button">
<span class="material-symbols-outlined text-[24px]" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex flex-col">
<h1 class="font-headline text-[21px] font-semibold leading-tight text-main tracking-normal">
            Word of the Day
          </h1>
<span class="text-xs text-secondary font-medium tracking-tight mt-0.5">
            🍋 Español de viaje
          </span>
</div>
</div>
<div class="w-11 h-11 flex items-center justify-center">
<!-- Overflow context slot (kept quiet according to the design system) -->
<span class="text-xs font-serif text-secondary tracking-widest opacity-60">№ 43</span>
</div>
</nav>
<!-- Main Content Canvas (Quiet Notebook Atmosphere) -->
<section class="flex-1 flex flex-col justify-between px-6 pt-8 pb-4 overflow-y-auto">
<!-- Quiet Centered Illustration & Literary Message -->
<div class="my-auto flex flex-col items-center text-center">
<!-- Elegant Stationery Line Drawing -->
<div class="w-36 h-36 rounded-full bg-surface border border-divider flex items-center justify-center shadow-sm relative">
<svg class="w-24 h-24 text-primary" fill="none" stroke="currentColor" viewbox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
<!-- Closed notebook outline with sewn binding -->
<rect class="stroke-primary" fill="#FFFCF6" height="58" rx="4" stroke="currentColor" stroke-width="1.75" width="46" x="26" y="22"></rect>
<line stroke="#59675E" stroke-dasharray="2 2" stroke-width="1.25" x1="33" x2="33" y1="22" y2="80"></line>
<!-- Book spine accent line -->
<path d="M26 25 H33" stroke="currentColor" stroke-width="1.5"></path>
<path d="M26 77 H33" stroke="currentColor" stroke-width="1.5"></path>
<!-- Bookmark ribbon hanging quietly -->
<path d="M52 22 V42 L57 38 L62 42 V22" fill="#E2ECDF" stroke="currentColor" stroke-linejoin="round" stroke-width="1.5"></path>
<!-- Leaf sprig / Morning twig emerging from pages -->
<path d="M56 22 C56 14 65 11 65 11" stroke="#345B43" stroke-linecap="round" stroke-width="1.75"></path>
<path d="M60 16 C63 15 67 17 67 17 C67 17 67 20 64 21 C61 22 60 16 60 16 Z" fill="#E2ECDF" stroke="#345B43" stroke-linejoin="round" stroke-width="1.25"></path>
<path d="M55 18 C52 17 50 14 50 14 C50 14 53 13 55 14 C57 15 55 18 55 18 Z" fill="#E2ECDF" stroke="#345B43" stroke-linejoin="round" stroke-width="1.25"></path>
<!-- Quiet morning arc (rising warmth) -->
<path d="M18 48 C18 34 27 24 38 21" stroke="#D8DED2" stroke-dasharray="3 3" stroke-linecap="round" stroke-width="1.25"></path>
</svg>
<!-- Small natural leaf accent -->
<div class="absolute -bottom-1 -right-1 w-8 h-8 rounded-full bg-surface border border-divider flex items-center justify-center text-primary shadow-xs">
<span class="material-symbols-outlined text-[18px]" data-icon="spa">spa</span>
</div>
</div>
<!-- Heading in EB Garamond -->
<h2 class="font-headline text-[26px] font-semibold text-main leading-tight mt-7">
          A few more words to begin.
        </h2>
<!-- Explanatory Copy in DM Sans -->
<p class="font-body text-[16px] text-secondary leading-relaxed max-w-[310px] mt-3">
          Word of the Day is available once this collection has at least 5 terms. You have 3.
        </p>
<!-- Subtle Status Callout Card (No gamification, purely factual) -->
<div class="w-full max-w-[320px] bg-surface rounded-xl border border-divider p-4 mt-6 flex items-center justify-between text-sm transition-all hover:border-[#B8C6BC]">
<div class="flex items-center gap-2.5">
<span aria-label="Lemon emoji" class="text-base select-none" role="img">🍋</span>
<span class="font-medium text-main text-[14px]">Español de viaje</span>
</div>
<div class="text-[13px] text-secondary font-medium tracking-tight">
            3 of 5 terms needed
          </div>
</div>
<!-- Notebook annotation footnote -->
<p class="text-xs text-secondary opacity-75 mt-3 italic font-serif">
          Each morning selects one thoughtful term to revisit.
        </p>
</div>
<!-- Lower Thumb Zone Controls -->
<footer class="w-full flex flex-col items-center pt-4 pb-2 shrink-0">
<!-- Primary Action Button: 56dp height (h-14), 12dp rounded corners -->
<button class="w-full h-14 bg-primary text-white rounded-xl font-medium text-[16px] tracking-normal flex items-center justify-center gap-2 hover:opacity-95 active:opacity-90 active:scale-[0.99] transition-all shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" type="button">
<span class="material-symbols-outlined text-[22px]" data-icon="add">add</span>
<span>Add 2 more terms</span>
</button>
<!-- Secondary Quiet Action Button -->
<button class="w-full h-12 text-secondary hover:text-main font-medium text-[15px] flex items-center justify-center mt-2 rounded-xl transition-colors hover:bg-surface active:opacity-80" type="button">
          Back to collection
        </button>
</footer>
</section>
<!-- Android Gesture Bar -->
<div class="w-full h-6 flex items-center justify-center pb-2 shrink-0">
<div class="w-32 h-1 bg-main opacity-20 rounded-full"></div>
</div>
</main>
</body></html>
