<!-- Interactive behavior for card translation reveal/hide -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const card = document.getElementById('card-toggle-target');
      const textElem = document.getElementById('translation-text');
      const iconElem = document.getElementById('toggle-icon');
      let revealed = false;

      function toggleTranslation() {
        revealed = !revealed;
        if (revealed) {
          textElem.textContent = 'to stroll, to wander aimlessly';
          textElem.classList.remove('text-text-secondary');
          textElem.classList.add('text-[#C1DFC4]', 'italic');
          iconElem.textContent = 'visibility_off';
        } else {
          textElem.textContent = 'Show translation';
          textElem.classList.remove('text-[#C1DFC4]', 'italic');
          textElem.classList.add('text-text-secondary');
          iconElem.textContent = 'visibility';
        }
      }

      card.addEventListener('click', toggleTranslation);
      card.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          toggleTranslation();
        }
      });
    });
  </script>
