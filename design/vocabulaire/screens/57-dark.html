<body class="min-h-screen flex items-center justify-center p-0 sm:p-4 text-text-main selection:bg-surface-variant">

<!-- 1. Native Android Dark Status Bar -->

<time class="font-secondary-medium text-secondary-medium tracking-tight text-text-main">09:41</time>

<span class="material-symbols-outlined text-[17px]" data-icon="signal_cellular_alt">signal_cellular_alt</span>

<span class="material-symbols-outlined text-[19px] ml-0.5" data-icon="battery_full">battery_full</span>
</div>
</header>
<!-- 2. Top App Bar (Shared Components JSON Anchor) -->
<!-- Maps directly to TopAppBar specs from JSON: h-14, arrow_back, 'Flashcard practice' in EB Garamond -->
<nav aria-label="Top Navigation" class="flex items-center w-full px-gutter max-w-[480px] mx-auto h-14 bg-surface shrink-0 z-10">
<button aria-label="Go back" class="w-10 h-10 -ml-2 mr-2 flex items-center justify-center rounded-full text-text-main hover:bg-surface-variant transition-colors active:scale-[0.96]" type="button">
<span class="material-symbols-outlined text-[24px]" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-section-heading text-section-heading text-text-main tracking-tight select-none">
        Flashcard practice
      </h1>
</nav>
<!-- 3. Content Canvas Area (Gutter 24dp / px-6) -->
<section class="flex-1 px-margin flex flex-col justify-start pt-3">
<!-- Interactive Stationery Flashcard -->
<article aria-expanded="false" aria-label="Flashcard for flâner. Tap to reveal translation." class="field-card w-full bg-surface-sheet border border-border-subtle rounded-3xl p-6 sm:p-7 cursor-pointer text-left focus:outline-none focus:ring-1 focus:ring-primary-container" id="flashcard" role="button" tabindex="0">
<!-- Term Headword -->
<h2 class="font-page-title text-page-title text-text-main font-normal tracking-wide">
          flâner
        </h2>
<!-- Secondary Toggle Text & Hidden Revealed State -->
<div class="mt-3">
<p class="font-secondary text-secondary text-text-secondary transition-opacity duration-200" id="toggle-label">
            Show translation
          </p>
<p class="hidden font-body-default text-body-default text-primary pt-1 transition-all duration-200" id="translation-content">
            to stroll, to saunter aimlessly
          </p>
</div>
</article>
</section>
<!-- 4. Bottom Area (Disabled Primary Button + Android Navigation Pill) -->
<footer class="w-full px-margin pb-3 pt-4 flex flex-col items-center shrink-0">
<!-- Disabled Primary Button 'Next' -->
<button aria-disabled="true" class="h-14 w-full rounded-2xl bg-surface-recessed border border-border-subtle/50 text-[#59675E] font-button-text text-button-text flex items-center justify-center cursor-not-allowed select-none opacity-60 transition-none" disabled="" type="button">
        Next
      </button>
<!-- Android Navigation Gesture Bar Pill -->
<div class="w-full flex justify-center items-center pt-5 pb-1">
<div aria-hidden="true" class="w-[72px] h-[4px] bg-border-subtle/80 rounded-full"></div>
</div>
</footer>
</main>
<!-- Interactive behavior: Tap card to toggle 'Show translation' / state reflection -->
<script>
    const flashcard = document.getElementById('flashcard');
    const toggleLabel = document.getElementById('toggle-label');
    const translationContent = document.getElementById('translation-content');

    let revealed = false;

    function toggleTranslation() {
      revealed = !revealed;
      flashcard.setAttribute('aria-expanded', String(revealed));
      if (revealed) {
        toggleLabel.textContent = 'Hide translation';
        translationContent.classList.remove('hidden');
      } else {
        toggleLabel.textContent = 'Show translation';
        translationContent.classList.add('hidden');
      }
    }

    flashcard.addEventListener('click', toggleTranslation);
    flashcard.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        toggleTranslation();
      }
    });
  </script>
