<!-- Interactive Logic for Card Toggle and Next Flow -->
<script>
    (function() {
      // Realtime subtle clock update
      function updateClock() {
        const clockEl = document.getElementById('status-clock');
        if (!clockEl) return;
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        clockEl.textContent = `${hours}:${minutes}`;
      }
      updateClock();
      setInterval(updateClock, 30000);

      // Flashcards dataset
      const cards = [
        { word: "flâner", translation: "to stroll, to wander aimlessly" },
        { word: "neko", translation: "cat" },
        { word: "komorebi", translation: "sunlight filtering through trees" },
        { word: "dépaysant", translation: "giving a feeling of total change of scenery" },
        { word: "saudade", translation: "a deep melancholic longing" }
      ];

      let currentIndex = 0;
      let isTranslationVisible = false;

      const cardElement = document.getElementById('flashcard');
      const headwordEl = document.getElementById('card-headword');
      const translationTextEl = document.getElementById('translation-text');
      const toggleLabelEl = document.getElementById('toggle-label');
      const nextBtn = document.getElementById('next-button');

      function updateCardView() {
        const item = cards[currentIndex];
        headwordEl.textContent = item.word;
        translationTextEl.textContent = item.translation;

        if (isTranslationVisible) {
          translationTextEl.classList.remove('hidden');
          toggleLabelEl.textContent = 'Hide translation';
        } else {
          translationTextEl.classList.add('hidden');
          toggleLabelEl.textContent = 'Show translation';
        }
      }

      function toggleTranslation() {
        isTranslationVisible = !isTranslationVisible;
        updateCardView();
      }

      function nextCard() {
        currentIndex = (currentIndex + 1) % cards.length;
        isTranslationVisible = false;
        updateCardView();
      }

      // Event Listeners
      cardElement.addEventListener('click', toggleTranslation);
      cardElement.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          toggleTranslation();
        }
      });

      nextBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        nextCard();
      });

      // Initial state render
      updateCardView();
    })();
  </script>
