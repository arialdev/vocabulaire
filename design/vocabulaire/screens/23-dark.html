<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>23 Saved filters — Dark</title>
<!-- Typography: EB Garamond (literary serif) & DM Sans (clean editorial sans) -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&amp;family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          canvas: "#171E1B",
          surface: "#222D27",
          recessed: "#1C2520",
          main: "#F3F0E7",
          secondary: "#B8C6BC",
          divider: "#45574A",
          primary: "#B9D8BB",
          "on-primary": "#173824",
          "selected-surface": "#344D3A",
          "grammatical-text": "#F3C3AA",
          "grammatical-fill": "#49362D",
          "thematic-text": "#C1DFC4",
          "thematic-fill": "#344D3A",
          destructive: "#E57373",
          "error-surface": "#3E2723"
        },
        borderRadius: {
          "DEFAULT": "0.5rem",
          "lg": "1rem",
          "xl": "1.5rem",
          "full": "9999px"
        },
        fontFamily: {
          headline: ["EB Garamond", "serif"],
          display: ["EB Garamond", "serif"],
          body: ["DM Sans", "sans-serif"],
          label: ["DM Sans", "sans-serif"]
        }
      },
    },
  }
</script>
<style>
  .material-symbols-outlined {

    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body class="bg-canvas min-h-screen w-full font-body text-main selection:bg-selected-surface overflow-hidden m-0 p-0">

<main class="relative w-full h-full min-h-screen max-h-screen bg-canvas overflow-hidden flex flex-col">

<div aria-hidden="true" class="absolute inset-0 flex flex-col pointer-events-none select-none">
<div class="h-6 w-full flex justify-between items-center px-6 pt-1 text-[13px] font-medium text-secondary">
<span>09:41</span>
<div class="flex items-center gap-1.5 text-secondary">
<span class="material-symbols-outlined !text-[15px]">signal_cellular_alt</span>
<span class="material-symbols-outlined !text-[15px]">wifi</span>
<span class="material-symbols-outlined !text-[17px]">battery_full</span>
</div>
</div>
<header class="flex justify-between items-center h-14 px-6 border-b border-divider">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined">arrow_back</span>
<span class="font-headline font-semibold text-2xl">☕ Everyday French</span>
</div>

<span class="material-symbols-outlined">search</span>
<span class="material-symbols-outlined">more_vert</span>
</div>

<div class="h-14 border-b border-divider/60"></div>
<div class="h-14 border-b border-divider/60"></div>
<div class="h-14 border-b border-divider/60"></div>
</div>
</div>

</div>

<div>

        </h2>
<p class="text-xs text-secondary mt-0.5">☕ Everyday French · 3 saved filters</p>
</div>
<button aria-label="Close filters" class="w-10 h-10 -mr-2 rounded-full flex items-center justify-center text-secondary hover:text-main hover:bg-recessed active:bg-recessed transition-colors" type="button">
<span class="material-symbols-outlined !text-[20px]">close</span>
</button>

        </button>
<button class="flex-1 py-2 text-center rounded-lg bg-surface text-main border border-divider shadow-xs font-semibold" type="button">
          Saved
        </button>
</div>
</div>

<div class="flex-1 overflow-y-auto px-6 py-3 space-y-3">

<div class="flex items-center justify-between text-xs text-secondary px-0.5">
<span>Saved combinations for this notebook</span>
<span class="italic font-serif text-[11px]">Stores search &amp; categories</span>
</div>
<!-- Saved Filter 1: Highlighted / Currently Applied -->
<div class="p-3.5 rounded-xl border-2 border-primary bg-recessed flex items-start justify-between shadow-xs">

<div class="w-10 h-10 rounded-xl bg-surface border border-divider flex items-center justify-center text-xl shrink-0 shadow-xs">
            ☕
          </div>
<div class="min-w-0 flex-1">
<div class="flex items-center gap-2">
<h3 class="font-headline font-semibold text-[17px] text-main leading-tight truncate">Café conversations</h3>
<span class="inline-flex items-center gap-1 text-[11px] font-semibold text-thematic-text bg-selected-surface px-2 py-0.5 rounded-full border border-divider">

<span>Applied</span>
</span>
</div>
<p class="text-xs text-secondary font-medium mt-1">

</p>
<div class="flex items-center gap-1.5 mt-1.5 flex-wrap">
<span class="text-[11px] px-2 py-0.5 rounded bg-grammatical-fill text-grammatical-text font-medium">Expression</span>
<span class="text-secondary text-xs">+</span>
<span class="text-[11px] px-2 py-0.5 rounded bg-thematic-fill text-thematic-text font-medium">Food &amp; drink</span>
</div>
</div>
</div>
<!-- Overflow Delete Button -->
<button aria-label="Filter options" class="w-9 h-9 -mr-1 rounded-full flex items-center justify-center text-secondary hover:text-main hover:bg-surface transition-colors" type="button">
<span class="material-symbols-outlined !text-[18px]">more_vert</span>
</button>
</div>
<!-- Saved Filter 2: Travel verbs -->
<div class="p-3.5 rounded-xl border border-divider bg-recessed hover:bg-surface/60 transition-colors flex items-start justify-between">
<button class="flex items-start gap-3 min-w-0 flex-1 text-left" type="button">
<div class="w-10 h-10 rounded-xl bg-surface border border-divider flex items-center justify-center text-xl shrink-0">

          </div>
<div class="min-w-0 flex-1">
<div class="flex items-center justify-between pr-2">

<span class="text-xs font-medium text-primary hover:underline">Apply</span>

<p class="text-xs text-secondary mt-1">

<span class="text-secondary text-xs">+</span>
<span class="text-[11px] px-2 py-0.5 rounded bg-thematic-fill text-thematic-text font-medium">Travel</span>

</div>
</button>
<!-- Overflow Delete Button -->
<button aria-label="Filter options" class="w-9 h-9 -mr-1 rounded-full flex items-center justify-center text-secondary hover:text-main hover:bg-surface transition-colors" type="button">
<span class="material-symbols-outlined !text-[18px]">more_vert</span>
</button>
</div>
<!-- Saved Filter 3: Everyday words -->
<div class="p-3.5 rounded-xl border border-divider bg-recessed hover:bg-surface/60 transition-colors flex items-start justify-between">
<button class="flex items-start gap-3 min-w-0 flex-1 text-left" type="button">
<div class="w-10 h-10 rounded-xl bg-surface border border-divider flex items-center justify-center text-xl shrink-0">
            🌱
          </div>
<div class="min-w-0 flex-1">
<div class="flex items-center justify-between pr-2">
<h3 class="font-headline font-semibold text-[17px] text-main leading-tight truncate">Everyday words</h3>
<span class="text-xs font-medium text-primary hover:underline">Apply</span>
</div>
<p class="text-xs text-secondary mt-1">

            </p>
<div class="flex items-center gap-1.5 mt-1.5 flex-wrap">
<span class="text-[11px] px-2 py-0.5 rounded bg-thematic-fill text-thematic-text font-medium">Everyday life</span>
</div>
</div>
</button>
<!-- Overflow Delete Button -->
<button aria-label="Filter options" class="w-9 h-9 -mr-1 rounded-full flex items-center justify-center text-secondary hover:text-main hover:bg-surface transition-colors" type="button">
<span class="material-symbols-outlined !text-[18px]">more_vert</span>
</button>
</div>
</div>
<!-- Anchored Footer Action Zone -->
<div class="p-6 pt-3 pb-3 border-t border-divider/60 bg-surface flex flex-col gap-2">
<!-- Primary 56dp CTA: Save current selection -->
<button class="w-full h-14 bg-primary text-on-primary font-medium text-base rounded-[12px] flex items-center justify-center gap-2 shadow-xs hover:opacity-95 active:opacity-90 transition duration-150" type="button">
<span class="material-symbols-outlined !text-[20px] text-on-primary">bookmark_add</span>
<span class="font-semibold tracking-wide text-on-primary">Save current selection</span>
</button>
<button class="w-full h-10 bg-transparent text-secondary text-sm font-medium hover:text-main flex items-center justify-center transition-colors" type="button">

      </button>
</div>
<!-- Android Gesture Pill Inset -->
<div class="h-5 w-full flex items-center justify-center pb-2 bg-surface">
<div class="w-32 h-1 bg-secondary/30 rounded-full"></div>
</div>
</section>
