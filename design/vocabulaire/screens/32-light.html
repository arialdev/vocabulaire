<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Vocabulaire — Add term</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&amp;family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            canvas: "#F8F5EE",
            surface: "#FFFCF6",
            recessed: "#F0EDE5",
            main: "#20382E",
            secondary: "#59675E",
            divider: "#D8DED2",
            primary: "#2D6046",
            "on-primary": "#FFFFFF",
            selected: "#E2ECDF",
            grammatical: "#684435",
            "grammatical-fill": "#F1E5DC",
            thematic: "#345B43",
            "thematic-fill": "#E2ECDF",
            destructive: "#A53532",
            error: "#FBE6E1"
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "1rem",
            "xl": "0.75rem",
            "2xl": "1rem",
            "full": "9999px"
          },
          fontFamily: {
            headline: ["EB Garamond", "serif"],
            display: ["EB Garamond", "serif"],
            body: ["DM Sans", "sans-serif"],
            label: ["DM Sans", "sans-serif"]
          }
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      line-height: 1;
      display: inline-block;
      vertical-align: middle;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #D8DED2;
      border-radius: 9999px;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-[#ECE8DF] flex justify-center items-center min-h-screen p-0 m-0 antialiased font-body selection:bg-selected selection:text-main">
<!-- Android Artboard (412x892) -->
<main class="w-[412px] h-[892px] bg-canvas text-main relative flex flex-col shadow-2xl overflow-hidden">
<!-- System Status Bar (24dp) -->
<header class="w-full h-8 px-6 pt-2 flex items-center justify-between text-xs font-medium text-main shrink-0 select-none z-30">
<span class="tracking-tight font-semibold">9:41</span>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[15px]" style="font-variation-settings: 'FILL' 1;">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[15px]" style="font-variation-settings: 'FILL' 1;">wifi</span>
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">battery_full</span>
</div>
</header>
<!-- Top App Bar (56dp) -->
<div class="w-full h-14 px-3 flex items-center justify-between shrink-0 border-b border-divider/60 bg-canvas/90 backdrop-blur-sm z-20">
<div class="flex items-center gap-1">
<button aria-label="Discard and return to vocabulary list" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-recessed active:bg-divider/50 transition-colors text-main" type="button">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
<div class="flex flex-col">
<h1 class="font-headline text-[22px] font-semibold leading-tight text-main tracking-tight">Add term</h1>
</div>
</div>
<div class="pr-2 flex items-center">
<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-recessed border border-divider/70 text-xs font-medium text-secondary">
<span class="text-sm">☕</span>
<span class="truncate max-w-[120px]">Everyday French</span>
</span>
</div>
</div>
<!-- Scrollable Form Canvas -->
<div class="flex-1 overflow-y-auto custom-scrollbar px-6 pt-4 pb-28 space-y-6">
<!-- Notebook Folio & Collection Context -->
<!-- Field 1: Original Expression -->
<div class="space-y-2">
<div class="flex items-baseline justify-between">
<label class="font-body text-sm font-semibold text-main tracking-wide" for="original-expression">
            Original expression
          </label>
<span class="font-body text-xs text-secondary font-normal tracking-wide">Required</span>
</div>
<input class="w-full h-14 bg-surface border border-divider rounded-xl px-4 text-main font-headline text-xl placeholder:text-secondary/50 placeholder:font-body placeholder:text-base focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all shadow-sm" id="original-expression" placeholder="e.g., flâner" type="text"/>
<p class="text-xs text-secondary/80">Preserve accents, articles, or full expressions as heard.</p>
</div>
<!-- Field 2: Translation -->
<div class="space-y-2">
<div class="flex items-baseline justify-between">
<label class="font-body text-sm font-semibold text-main tracking-wide" for="translation">
            Translation
          </label>
<span class="font-body text-xs text-secondary font-normal tracking-wide">Required</span>
</div>
<input class="w-full h-14 bg-surface border border-divider rounded-xl px-4 text-main font-body text-base placeholder:text-secondary/50 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all shadow-sm" id="translation" placeholder="Meaning or translation" type="text"/>
</div>
<!-- Field 3: Notes -->
<div class="space-y-2">
<div class="flex items-baseline justify-between">
<label class="font-body text-sm font-semibold text-main tracking-wide" for="notes">
            Notes
          </label>
<span class="font-body text-xs text-secondary/70 font-normal">Optional</span>
</div>
<textarea class="w-full bg-surface border border-divider rounded-xl px-4 py-3 text-main font-body text-sm placeholder:text-secondary/50 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all resize-none shadow-sm leading-relaxed" id="notes" placeholder="Context, example sentence, or nuance..." rows="3"></textarea>
</div>
<!-- Field 4: Categories -->
<div class="space-y-4 pt-1"><div class="flex items-center justify-between"><div class="flex items-baseline gap-2"><span class="font-body text-sm font-semibold text-main tracking-wide">Categories</span><span class="font-body text-xs text-secondary/70 font-normal">Optional</span></div><button class="inline-flex items-center gap-1 text-xs font-semibold text-primary hover:text-primary/80 transition-colors py-1 px-1" type="button"><span class="material-symbols-outlined text-[15px]">add</span><span>Manage</span></button></div><div class="space-y-2"><div class="flex items-center gap-1.5 text-xs font-semibold text-grammatical uppercase tracking-wider"><span class="text-[11px] font-bold font-serif px-1 py-0.2 rounded bg-grammatical-fill/80 text-grammatical leading-none">Aa</span><span>Grammatical</span></div><div class="flex flex-wrap gap-2"><button class="h-9 min-w-[48px] px-3.5 rounded-lg bg-surface border border-divider hover:bg-recessed active:bg-divider text-grammatical text-xs font-medium inline-flex items-center gap-1.5 transition-colors select-none" type="button"><span class="text-[10px] font-bold font-serif text-secondary">Aa</span><span>Noun</span></button><button class="h-9 min-w-[48px] px-3.5 rounded-lg bg-surface border border-divider hover:bg-recessed active:bg-divider text-grammatical text-xs font-medium inline-flex items-center gap-1.5 transition-colors select-none" type="button"><span class="text-[10px] font-bold font-serif text-secondary">Aa</span><span>Verb</span></button><button class="h-9 min-w-[48px] px-3.5 rounded-lg bg-surface border border-divider hover:bg-recessed active:bg-divider text-grammatical text-xs font-medium inline-flex items-center gap-1.5 transition-colors select-none" type="button"><span class="text-[10px] font-bold font-serif text-secondary">Aa</span><span>Expression</span></button></div></div><div class="space-y-2 pt-1"><div class="flex items-center gap-1.5 text-xs font-semibold text-thematic uppercase tracking-wider"><span class="text-xs">🌱</span><span>Thematic</span></div><div class="flex flex-wrap gap-2"><button class="h-9 min-w-[48px] px-3.5 rounded-lg bg-surface border border-divider hover:bg-recessed active:bg-divider text-thematic text-xs font-medium inline-flex items-center gap-1.5 transition-colors select-none" type="button"><span>🌱</span><span>Everyday life</span></button><button class="h-9 min-w-[48px] px-3.5 rounded-lg bg-surface border border-divider hover:bg-recessed active:bg-divider text-thematic text-xs font-medium inline-flex items-center gap-1.5 transition-colors select-none" type="button"><span>✈️</span><span>Travel</span></button><button class="h-9 min-w-[48px] px-3.5 rounded-lg bg-surface border border-divider hover:bg-recessed active:bg-divider text-thematic text-xs font-medium inline-flex items-center gap-1.5 transition-colors select-none" type="button"><span>☕</span><span>Food &amp; drink</span></button></div></div></div>
<!-- Literary Quote / Note footer -->
<div class="pt-4 pb-2 border-t border-divider/40">
<p class="font-headline italic text-xs text-secondary/70 text-center leading-relaxed">
          « Un mot appris est une nouvelle lucarne sur le monde. »
        </p>
</div>
</div>
<!-- Pinned Sticky Bottom Footer -->
<div class="absolute bottom-0 left-0 right-0 bg-canvas/95 backdrop-blur-md border-t border-divider px-6 pt-3 pb-3 z-30 shadow-[0_-4px_16px_rgba(0,0,0,0.03)]">
<div class="max-w-[364px] mx-auto space-y-3"><div class="flex flex-col gap-2"><button class="w-full h-14 bg-primary text-on-primary rounded-xl font-body text-base font-semibold tracking-wide flex items-center justify-center gap-2 shadow-sm hover:brightness-105 active:scale-[0.99] transition-all" type="button"><span class="material-symbols-outlined text-[22px]" style="font-variation-settings: 'FILL' 1;">check</span><span>Save term</span></button><button class="w-full h-9 flex items-center justify-center font-body text-sm font-medium text-secondary hover:text-main active:opacity-75 transition-colors" type="button">Cancel</button></div><div class="w-full flex justify-center items-center pb-0.5"><div class="w-32 h-1 bg-main/30 rounded-full"></div></div></div>
</div>
</main>
<script>
    // Lightweight toggle for interactive category chips in proposal demo
    document.querySelectorAll('.space-y-4 button[type="button"]').forEach(btn => {
      if (btn.innerText.includes('Manage categories')) return;
      btn.addEventListener('click', () => {
        const isGrammatical = btn.closest('.space-y-2').innerText.includes('Grammatical');
        const checkIcon = btn.querySelector('.material-symbols-outlined');
        
        if (checkIcon) {
          // Deselect
          checkIcon.remove();
          btn.classList.remove(
            isGrammatical ? 'bg-grammatical-fill' : 'bg-thematic-fill',
            isGrammatical ? 'border-grammatical/80' : 'border-thematic/80',
            'border-2', 'font-semibold', 'shadow-xs'
          );
          btn.classList.add('bg-surface', 'border', 'border-divider', 'font-medium');
        } else {
          // Select
          btn.classList.remove('bg-surface', 'border-divider', 'font-medium');
          btn.classList.add(
            isGrammatical ? 'bg-grammatical-fill' : 'bg-thematic-fill',
            isGrammatical ? 'border-grammatical/80' : 'border-thematic/80',
            'border-2', 'font-semibold', 'shadow-xs'
          );
          const icon = document.createElement('span');
          icon.className = `material-symbols-outlined text-[16px] ${isGrammatical ? 'text-grammatical' : 'text-thematic'} font-bold`;
          icon.innerText = 'check';
          btn.appendChild(icon);
        }
      });
    });
  </script>
</body></html>
